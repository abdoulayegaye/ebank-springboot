# ═══════════════════════════════════════════════════════════════
# docker-compose.yml — Orchestrateur principal eBank
# Utilise `include` pour charger chaque service séparément
#
# 🚀 Lancement  : docker compose up -d
# 🛑 Arrêt      : docker compose down
# 🧹 Reset complet : docker compose down -v
# 🧑🏾‍💻 Créer le réseau manuellement : docker network create ebank-network
# 🫆 Suivre les logs Keycloak : docker compose logs -f keycloak
# ═══════════════════════════════════════════════════════════════

include:
  - path: docker/mysql.yml
  - path: docker/phpmyadmin.yml
  - path: docker/postgres.yml
  - path: docker/pgadmin.yml
  - path: docker/keycloak.yml
  - path: docker/app.yml

# ═══════════════════════════════════════════════════════════════
# 🌐 Réseau partagé entre tous les services
# ═══════════════════════════════════════════════════════════════
networks:
  ebank-network:
    driver: bridge

# ═══════════════════════════════════════════════════════════════
# 🗂️  Architecture
#
#   MySQL      :3307  → App ebank     (users, comptes, operations)
#   PostgreSQL :5432  → Keycloak      (sessions, realms, clients)
#
# 🖥️  Interfaces
#   phpMyAdmin :8089  → MySQL
#   pgAdmin    :5050  → PostgreSQL
#   Keycloak   :8180  → IAM / Auth
#   App        :8088  → Spring Boot
#
#   Démarrer tout -> docker compose up -d
#   Démarrer un seul service -> docker compose up -d mysql
#   Voir les logs d'un service -> docker compose logs -f app
#   Arrêter et supprimer les volumes -> docker compose down -v
# ═══════════════════════════════════════════════════════════════