services:

  # =========================
  # MYSQL DATABASE
  # =========================
  mysql:
    image: mysql:8.0
    container_name: mysql-keycloak
    restart: always
    environment:
      MYSQL_DATABASE: keycloak_db
      MYSQL_USER: keycloak_user
      MYSQL_PASSWORD: keycloak_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - banking-net


  # =========================
  # PHPMYADMIN
  # =========================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    container_name: phpmyadmin-keycloak
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - banking-net


  # =========================
  # KEYCLOAK
  # =========================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak-banking
    command: start-dev
    restart: always

    environment:
      # Admin login
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      # DB Config
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_pass

      # Host config
      KC_HOSTNAME: localhost

    ports:
      - "8082:8080"

    depends_on:
      - mysql

    networks:
      - banking-net


# =========================
# VOLUMES
# =========================
volumes:
  mysql_data:


# =========================
# NETWORK
# =========================
networks:
  banking-net:
