# ─────────────────────────────────────────
# App Bancaire EBANK
# ─────────────────────────────────────────
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${DOCKER_HUB_USERNAME}/ebank:${APP_VERSION:-latest}
    container_name: ebank-app
    ports:
      - "8088:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_AUTH_SERVER_URL}/realms/ebank-realm
      SPRING_PROFILES_ACTIVE: docker
      SPRINGDOC_SWAGGER_UI_SERVER_URL: http://localhost:8088
    networks:
      - ebank-network
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started

networks:
  ebank-network:
    external: true