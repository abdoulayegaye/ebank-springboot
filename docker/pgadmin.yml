# ─────────────────────────────────────────
# pgAdmin Service — PostgreSQL GUI
# ─────────────────────────────────────────
services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ebank-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ebank-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgadmin_data:

networks:
  ebank-network:
    external: true